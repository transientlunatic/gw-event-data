kind: configuration
pipelines:
  bilby:
    quality:
      state vector:
        L1: L1:DCS-CALIB_STATE_VECTOR_C01
        H1: H1:DCS-CALIB_STATE_VECTOR_C01
        V1: V1:DQ_ANALYSIS_STATE_VECTOR
    sampler:
      sampler: dynesty
      parallel jobs: 2
      sampler kwargs: FastTest
    scheduler:
      local generation: True
      osg: True
      accounting group: ligo.dev.o4.cbc.pe.bilby
      request cpus: 16
  bayeswave:
    quality:
      state vector:
        L1: L1:DCS-CALIB_STATE_VECTOR_C01
        H1: H1:DCS-CALIB_STATE_VECTOR_C01
        V1: V1:DQ_ANALYSIS_STATE_VECTOR
    likelihood:
      iterations: 100000
      chains: 20
      threads: 4
    scheduler:
      copy frames: True
      accounting group: ligo.dev.o4.cbc.pe.bilby
      request memory: 1024
      request post memory: 16384
      osg: True
postprocessing:
  pesummary:
    accounting group: ligo.dev.o4.cbc.pe.lalinference
    cosmology: Planck15
    evolve spins: forward
    multiprocess: 4
    redshift: exact
    regenerate posteriors:
    - redshift
    - radiated_energy
    skymap samples: 2000
