kind: configuration
data:
  channels:
    H1: H1:GDS-CALIB_STRAIN_CLEAN
    L1: L1:GDS-CALIB_STRAIN_CLEAN
    V1: V1:Hrec_hoft_16384Hz
  frame types:
    H1: H1_HOFT_C00
    L1: L1_HOFT_C00
    V1: V1Online
pipelines:
  gwdata:
    scheduler:
      accounting group: ligo.dev.o4.cbc.pe.bilby
      request cpus: 1
  peconfigurator:
    scheduler:
      accounting group: ligo.dev.o4.cbc.pe.bilby
      request cpus: 1
  bilby:
    quality:
      state vector:
        L1: L1:DCS-CALIB_STATE_VECTOR_C01
        H1: H1:DCS-CALIB_STATE_VECTOR_C01
        V1: V1:DQ_ANALYSIS_STATE_VECTOR
    sampler:
      sampler: dynesty
      parallel jobs: 2
      sampler kwargs: FastTest
    scheduler:
      local generation: False
      osg: True
      accounting group: ligo.dev.o4.cbc.pe.bilby
      request cpus: 16
  bayeswave:
    quality:
      state vector:
        L1: L1:DCS-CALIB_STATE_VECTOR_C01
        H1: H1:DCS-CALIB_STATE_VECTOR_C01
        V1: V1:DQ_ANALYSIS_STATE_VECTOR
    likelihood:
      iterations: 100000
      chains: 20
      threads: 4
    scheduler:
      copy frames: True
      accounting group: ligo.dev.o4.cbc.pe.bilby
      request memory: 1024
      request disk: 3000000
      request post memory: 16384
      osg: True
postprocessing:
  pesummary:
    accounting group: ligo.dev.o4.cbc.pe.lalinference
    cosmology: Planck15
    evolve spins: forward
    multiprocess: 4
    redshift: exact
    regenerate posteriors:
    - redshift
    - radiated_energy
    skymap samples: 2000
